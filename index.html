<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive World Map</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Interactive World Map</p>
        <h1>Click any country to highlight it</h1>
        <p class="subtitle">
          Tap a country to illuminate it with a glow. Click again to deselect. Use the reset button to
          clear all highlights.
        </p>
        <div class="actions">
          <button class="reset" type="button">Reset All</button>
          <div class="legend">
            <span class="swatch"></span>
            <span>Selected country</span>
          </div>
        </div>
      </header>

      <section class="map-panel">
        <svg
          id="world-map"
          viewBox="0 0 1200 620"
          role="img"
          aria-label="Stylized world map with labeled countries"
        >
          <defs>
            <radialGradient id="ocean" cx="50%" cy="40%" r="75%">
              <stop offset="0%" stop-color="#1c2740" />
              <stop offset="70%" stop-color="#121a2b" />
              <stop offset="100%" stop-color="#0b111d" />
            </radialGradient>
            <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2c394f" />
              <stop offset="100%" stop-color="#20283a" />
            </linearGradient>
            <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
              <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1f2940" stroke-width="1" />
            </pattern>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="coloredBlur" />
              <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <clipPath id="map-clip">
              <rect x="40" y="30" width="1120" height="560" rx="90" />
            </clipPath>
          </defs>

          <g clip-path="url(#map-clip)">
            <rect class="ocean" x="40" y="30" width="1120" height="560" rx="90" fill="url(#ocean)" />
            <rect class="grid" x="40" y="30" width="1120" height="560" rx="90" fill="url(#grid)" />

            <g class="countries">
              <path
                class="country"
                data-name="Canada"
                d="M180 140 L360 120 L420 155 L410 200 L260 205 L180 175 Z"
              />
              <path
                class="country"
                data-name="United States"
                d="M200 210 L410 205 L455 255 L430 310 L235 305 L185 250 Z"
              />
              <path
                class="country"
                data-name="Mexico"
                d="M260 320 L420 315 L445 350 L410 380 L285 385 Z"
              />
              <path
                class="country"
                data-name="Peru"
                d="M360 420 L420 410 L445 450 L420 490 L360 480 Z"
              />
              <path
                class="country"
                data-name="Brazil"
                d="M430 370 L560 350 L610 410 L570 470 L460 470 L420 415 Z"
              />
              <path
                class="country"
                data-name="Argentina"
                d="M470 480 L560 470 L580 540 L520 570 L470 535 Z"
              />

              <path
                class="country"
                data-name="United Kingdom"
                d="M560 170 L590 170 L600 195 L575 205 L550 190 Z"
              />
              <path class="country" data-name="France" d="M600 215 L660 210 L680 250 L640 275 L595 255 Z" />
              <path class="country" data-name="Germany" d="M675 195 L720 195 L740 235 L710 260 L675 235 Z" />
              <path class="country" data-name="Spain" d="M595 275 L655 275 L670 310 L615 325 L585 300 Z" />
              <path class="country" data-name="Italy" d="M690 275 L735 285 L730 325 L690 340 L670 305 Z" />

              <path class="country" data-name="Morocco" d="M590 330 L640 330 L650 360 L600 365 L575 350 Z" />
              <path class="country" data-name="Egypt" d="M695 350 L750 350 L765 385 L725 400 L690 375 Z" />
              <path class="country" data-name="Nigeria" d="M640 395 L700 390 L715 430 L670 445 L625 425 Z" />
              <path class="country" data-name="Kenya" d="M705 430 L755 425 L770 465 L730 485 L700 460 Z" />
              <path
                class="country"
                data-name="South Africa"
                d="M660 500 L740 495 L780 535 L720 575 L650 560 L620 520 Z"
              />

              <path
                class="country"
                data-name="Russia"
                d="M740 120 L1010 120 L1080 165 L1030 210 L820 205 L740 165 Z"
              />
              <path
                class="country"
                data-name="China"
                d="M820 230 L980 225 L1030 270 L990 320 L860 320 L800 270 Z"
              />
              <path class="country" data-name="Japan" d="M1035 250 L1080 255 L1090 295 L1060 325 L1025 300 Z" />
              <path class="country" data-name="India" d="M800 320 L900 325 L925 380 L870 415 L820 370 Z" />
              <path
                class="country"
                data-name="Saudi Arabia"
                d="M880 390 L960 390 L980 435 L935 470 L870 445 Z"
              />

              <path
                class="country"
                data-name="Australia"
                d="M920 470 L1050 475 L1090 530 L1030 570 L920 555 L885 510 Z"
              />
              <path class="country" data-name="New Zealand" d="M1085 520 L1120 525 L1125 565 L1095 585 Z" />
            </g>

            <g class="labels">
              <text class="label" x="285" y="170">Canada</text>
              <text class="label" x="315" y="265">United States</text>
              <text class="label" x="340" y="355">Mexico</text>
              <text class="label" x="395" y="460">Peru</text>
              <text class="label" x="505" y="420">Brazil</text>
              <text class="label" x="520" y="540">Argentina</text>

              <text class="label" x="575" y="190">UK</text>
              <text class="label" x="635" y="245">France</text>
              <text class="label" x="705" y="230">Germany</text>
              <text class="label" x="625" y="305">Spain</text>
              <text class="label" x="705" y="315">Italy</text>

              <text class="label" x="620" y="355">Morocco</text>
              <text class="label" x="725" y="382">Egypt</text>
              <text class="label" x="670" y="430">Nigeria</text>
              <text class="label" x="735" y="468">Kenya</text>
              <text class="label" x="695" y="545">South Africa</text>

              <text class="label" x="900" y="170">Russia</text>
              <text class="label" x="910" y="275">China</text>
              <text class="label" x="1060" y="290">Japan</text>
              <text class="label" x="850" y="365">India</text>
              <text class="label" x="925" y="435">Saudi Arabia</text>

              <text class="label" x="1000" y="525">Australia</text>
              <text class="label" x="1105" y="560">NZ</text>
            </g>
          </g>
        </svg>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
